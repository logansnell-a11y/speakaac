AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Speak AAC — Lambda functions + API Gateway

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        SUPABASE_URL:            !Sub '{{resolve:ssm:/speak/SUPABASE_URL}}'
        SUPABASE_SERVICE_ROLE_KEY: !Sub '{{resolve:ssm:/speak/SUPABASE_SERVICE_ROLE_KEY}}'

Resources:

  # ── API Gateway ──────────────────────────────────────────────────────────────
  SpeakApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - https://speakaac.org
          - https://www.speakaac.org
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 600

  # ── ai-sentence ──────────────────────────────────────────────────────────────
  AiSentenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: speak-ai-sentence
      CodeUri: functions/ai-sentence/
      Handler: index.handler
      Description: Converts AAC symbol taps into natural sentences via Bedrock
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource: '*'
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpeakApi
            Path: /ai-sentence
            Method: POST
        Options:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpeakApi
            Path: /ai-sentence
            Method: OPTIONS

  # ── send-safety-alert ────────────────────────────────────────────────────────
  SendSafetyAlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: speak-send-safety-alert
      CodeUri: functions/send-safety-alert/
      Handler: index.handler
      Description: Sends private safety alert emails via Resend
      Environment:
        Variables:
          RESEND_API_KEY: !Sub '{{resolve:ssm:/speak/RESEND_API_KEY}}'
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpeakApi
            Path: /send-safety-alert
            Method: POST

  # ── stripe-webhook ───────────────────────────────────────────────────────────
  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: speak-stripe-webhook
      CodeUri: functions/stripe-webhook/
      Handler: index.handler
      Description: Handles Stripe checkout.session.completed — sets user tier in Supabase
      Environment:
        Variables:
          STRIPE_WEBHOOK_SECRET: !Sub '{{resolve:ssm:/speak/STRIPE_WEBHOOK_SECRET}}'
          STRIPE_SECRET_KEY:     !Sub '{{resolve:ssm:/speak/STRIPE_SECRET_KEY}}'
          STRIPE_PRICE_FAMILY:      !Sub '{{resolve:ssm:/speak/STRIPE_PRICE_FAMILY}}'
          STRIPE_PRICE_CLINIC:      !Sub '{{resolve:ssm:/speak/STRIPE_PRICE_CLINIC}}'
          STRIPE_PRICE_INSTITUTION: !Sub '{{resolve:ssm:/speak/STRIPE_PRICE_INSTITUTION}}'
          STRIPE_PRICE_LIFETIME:    !Sub '{{resolve:ssm:/speak/STRIPE_PRICE_LIFETIME}}'
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpeakApi
            Path: /stripe-webhook
            Method: POST

Outputs:
  ApiBaseUrl:
    Description: Base URL for all Speak Lambda endpoints
    Value: !Sub 'https://${SpeakApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  AiSentenceUrl:
    Value: !Sub 'https://${SpeakApi}.execute-api.${AWS::Region}.amazonaws.com/prod/ai-sentence'
  SendSafetyAlertUrl:
    Value: !Sub 'https://${SpeakApi}.execute-api.${AWS::Region}.amazonaws.com/prod/send-safety-alert'
  StripeWebhookUrl:
    Value: !Sub 'https://${SpeakApi}.execute-api.${AWS::Region}.amazonaws.com/prod/stripe-webhook'
